<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POZPÁTKU · reverzní magnetofon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>
<style>
  :root{
    --bay:#171310;        /* tělo přístroje */
    --panel:#211B16;      /* čelní panel */
    --edge:#332A22;       /* hrany, drážky */
    --label:#E9DFCB;      /* papírový štítek */
    --ink:#171310;
    --vu:#FFA028;         /* VU jantarová */
    --vu-dim:#7A4F1A;
    --rec:#E23B2E;        /* nahrávací červená */
    --text:#B7A995;
    --text-dim:#6E6152;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bay);
    background-image:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,160,40,.05), transparent 60%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 7px);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    display:flex; align-items:center; justify-content:center;
    height:100dvh; overflow:hidden;
    padding:clamp(6px,1.5vh,20px) clamp(8px,2vw,20px);
  }
  .deck{
    width:100%; max-width:820px;
    height:100%;
    display:flex; flex-direction:column;
    background:var(--panel);
    border:1px solid var(--edge);
    border-radius:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    overflow:hidden;
  }

  /* ---------- hlavička jako papírový štítek ---------- */
  .head{
    display:flex; align-items:stretch; gap:0;
    border-bottom:1px solid var(--edge);
  }
  .brand{
    flex:1; padding:clamp(8px,1.8vh,20px) 22px clamp(6px,1.4vh,16px);
  }
  .brand h1{
    font-family:'Archivo', sans-serif;
    font-variation-settings:'wdth' 125;
    font-weight:900; letter-spacing:.04em;
    font-size:clamp(18px,3.6vh,38px);
    color:var(--label); line-height:1;
  }
  .brand h1 .rev{
    display:inline-block; transform:scaleX(-1);
    color:var(--vu);
  }
  .brand p{font-size:11px; color:var(--text-dim); margin-top:6px; letter-spacing:.08em; text-transform:uppercase}
  .badge{
    width:96px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; border-left:1px dashed var(--edge); padding:12px;
  }
  .lamp{width:12px;height:12px;border-radius:50%;background:#3a2320;box-shadow:inset 0 0 3px #000;transition:.15s}
  .lamp.on{background:var(--rec); box-shadow:0 0 12px var(--rec), 0 0 30px rgba(226,59,46,.5)}
  .badge span{font-size:9px;letter-spacing:.2em;color:var(--text-dim)}

  /* ---------- cívky ---------- */
  .reels{
    position:relative;
    display:flex; justify-content:space-between; align-items:center;
    padding:clamp(8px,2.4vh,30px) clamp(32px,8%,56px) clamp(4px,1vh,8px);
    flex:0 1 auto;
  }
  .reel{
    width:clamp(56px,13vh,110px); height:clamp(56px,13vh,110px); border-radius:50%;
    border:2px solid var(--edge);
    background:
      radial-gradient(circle at 50% 50%, #0d0a08 0 18%, transparent 18%),
      conic-gradient(from 0deg, #2b241d 0 30deg, #1c1712 30deg 60deg, #2b241d 60deg 90deg, #1c1712 90deg 120deg, #2b241d 120deg 150deg, #1c1712 150deg 180deg, #2b241d 180deg 210deg, #1c1712 210deg 240deg, #2b241d 240deg 270deg, #1c1712 270deg 300deg, #2b241d 300deg 330deg, #1c1712 330deg 360deg);
    position:relative;
  }
  .reel::after{
    content:''; position:absolute; inset:32%; border-radius:50%;
    background:var(--label);
    background-image:radial-gradient(circle, transparent 30%, rgba(0,0,0,.15) 31%, transparent 33%);
    border:3px solid #0d0a08;
  }
  .tape-line{
    position:absolute; left:22%; right:22%; top:50%; height:2px;
    background:linear-gradient(90deg, transparent, #4a3a28 12%, #4a3a28 88%, transparent);
  }
  @keyframes spinBack{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
  @keyframes spinFwd{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .deck.playing .reel{animation:spinBack 1.6s linear infinite}
  .deck.recording .reel{animation:spinFwd 2.4s linear infinite}
  @media (prefers-reduced-motion: reduce){
    .reel{animation:none !important}
  }
  @media (max-height:520px){
    .reels{display:none}
    .brand p{display:none}
  }
  @media (max-width:480px){
    button{min-width:110px; padding-left:10px; padding-right:10px}
    .toggle{min-width:110px}
  }

  /* ---------- vlnovka ---------- */
  .scope{
    margin:clamp(6px,1.6vh,18px) 22px 0;
    border:1px solid var(--edge);
    border-radius:8px;
    background:#0e0b09;
    position:relative;
    flex:1 1 auto; min-height:56px;
    display:flex;
  }
  canvas{display:block; width:100%; height:100%; flex:1}
  .scope .tag{
    position:absolute; top:6px; right:10px;
    font-size:9px; letter-spacing:.2em; color:var(--vu-dim);
  }
  .clock{
    position:absolute; top:6px; left:10px;
    font-size:11px; color:var(--vu); letter-spacing:.1em;
    text-shadow:0 0 8px rgba(255,160,40,.5);
  }

  /* ---------- ovládání ---------- */
  .controls{
    display:flex; flex-wrap:wrap; gap:clamp(6px,1vh,10px);
    padding:clamp(8px,1.8vh,18px) 22px clamp(4px,1vh,8px);
  }
  button{
    font-family:'IBM Plex Mono', monospace;
    font-size:clamp(10px,1.4vh,12px); font-weight:600; letter-spacing:.12em; text-transform:uppercase;
    padding:clamp(8px,1.5vh,13px) 18px; border-radius:8px;
    border:1px solid var(--edge);
    background:linear-gradient(#2a231c, #1d1712);
    color:var(--text);
    cursor:pointer;
    transition:.12s;
    flex:1; min-width:140px;
  }
  button:hover:not(:disabled){border-color:#4a3d30; color:var(--label)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.35; cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--vu); outline-offset:2px}
  #btnRec{border-color:#5a2622; color:#f0a29a}
  #btnRec.armed{background:linear-gradient(#4a1f1a,#331512); color:#fff; border-color:var(--rec)}
  #btnPlay{border-color:#5a4a22; color:var(--vu)}
  .toggle{display:flex; align-items:center; gap:10px; flex:1; min-width:140px;
    justify-content:center; border:1px dashed var(--edge); border-radius:8px; padding:0 14px;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; user-select:none; cursor:pointer}
  .toggle input{accent-color:var(--vu); width:16px; height:16px; cursor:pointer}

  .row2{display:flex; gap:clamp(6px,1vh,10px); padding:0 22px clamp(4px,1vh,8px); flex-wrap:wrap}
  .speed{
    flex:1; min-width:220px; display:flex; align-items:center; gap:12px;
    border:1px dashed var(--edge); border-radius:8px; padding:clamp(6px,1.2vh,12px) 16px;
    font-size:clamp(9px,1.3vh,11px); letter-spacing:.1em; text-transform:uppercase;
  }
  input[type=range]{flex:1; accent-color:var(--vu)}
  .speed output{color:var(--vu); min-width:44px; text-align:right}

  .exports{display:flex; gap:clamp(6px,1vh,10px); padding:clamp(4px,1vh,10px) 22px clamp(8px,1.8vh,20px); flex-wrap:wrap}
  .exports button{background:none; border-style:dashed; font-weight:500}

  .status{
    border-top:1px solid var(--edge);
    padding:clamp(5px,1.1vh,10px) 22px; font-size:clamp(9px,1.3vh,11px); color:var(--text-dim);
    letter-spacing:.06em; min-height:clamp(26px,4vh,38px); display:flex; align-items:center;
  }
  .status b{color:var(--vu); font-weight:600}
</style>
</head>
<body>
<div class="deck" id="deck">
  <div class="head">
    <div class="brand">
      <h1>POZPÁT<span class="rev">KU</span></h1>
      <p>reverzní magnetofon · mikrofon → páska → zpětný chod</p>
    </div>
    <div class="badge">
      <div class="lamp" id="lamp"></div>
      <span>REC</span>
    </div>
  </div>

  <div class="reels">
    <div class="tape-line"></div>
    <div class="reel"></div>
    <div class="reel"></div>
  </div>

  <div class="scope">
    <span class="clock" id="clock">0:00.0</span>
    <span class="tag">STOPA A ◄</span>
    <canvas id="wave" width="1200" height="176"></canvas>
  </div>

  <div class="controls">
    <button id="btnRec">● Nahrát</button>
    <button id="btnPlay" disabled>◄ Přehrát pozpátku</button>
    <button id="btnStop" disabled>■ Stop</button>
    <label class="toggle"><input type="checkbox" id="chkLoop"> Smyčka</label>
  </div>

  <div class="row2">
    <label class="speed">Rychlost
      <input type="range" id="rngSpeed" min="0.5" max="2" step="0.05" value="1">
      <output id="outSpeed">1.00×</output>
    </label>
    <button id="btnFwd" disabled style="flex:0 1 auto;min-width:150px">► Původní směr</button>
  </div>

  <div class="exports">
    <button id="btnMp3" disabled>⬇ Uložit MP3 (pozpátku)</button>
    <button id="btnMp3Fwd" disabled>⬇ Uložit MP3 (originál)</button>
  </div>

  <div class="status" id="status">Stiskni <b>● Nahrát</b> a povol přístup k mikrofonu.</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const deck = $('deck'), lamp = $('lamp'), statusEl = $('status'), clock = $('clock');
  const btnRec = $('btnRec'), btnPlay = $('btnPlay'), btnStop = $('btnStop'),
        btnFwd = $('btnFwd'), btnMp3 = $('btnMp3'), btnMp3Fwd = $('btnMp3Fwd');
  const chkLoop = $('chkLoop'), rngSpeed = $('rngSpeed'), outSpeed = $('outSpeed');
  const canvas = $('wave'), cx = canvas.getContext('2d');

  function fitCanvas(){
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.max(1, Math.round(r.width  * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    if(bufRev && !playing && !recording) drawBuffer(bufRev);
  }
  window.addEventListener('resize', fitCanvas);

  let audioCtx = null;
  let mediaRecorder = null, chunks = [];
  let bufFwd = null, bufRev = null;      // AudioBuffery
  let srcNode = null, analyser = null;
  let recording = false, playing = false;
  let recStart = 0, playStart = 0, rafId = null;

  const setStatus = html => statusEl.innerHTML = html;
  const fmt = s => {
    const m = Math.floor(s/60), sec = (s%60).toFixed(1).padStart(4,'0');
    return m + ':' + sec;
  };

  function ensureCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  /* ---------- vlnovka ---------- */
  function drawBuffer(buf){
    const W = canvas.width, H = canvas.height, mid = H/2;
    cx.clearRect(0,0,W,H);
    if(!buf) return;
    const data = buf.getChannelData(0);
    const step = Math.max(1, Math.floor(data.length / W));
    cx.strokeStyle = '#FFA028'; cx.lineWidth = 1.4; cx.globalAlpha = .9;
    cx.beginPath();
    for(let x=0; x<W; x++){
      let min=1, max=-1;
      const off = x*step;
      for(let i=0;i<step;i+=4){ const v=data[off+i]||0; if(v<min)min=v; if(v>max)max=v; }
      cx.moveTo(x, mid + min*mid*.9);
      cx.lineTo(x, mid + max*mid*.9 + .5);
    }
    cx.stroke(); cx.globalAlpha = 1;
  }
  function drawLive(){
    if(!analyser) return;
    const arr = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(arr);
    const W = canvas.width, H = canvas.height, mid = H/2;
    cx.clearRect(0,0,W,H);
    cx.strokeStyle = recording ? '#E23B2E' : '#FFA028';
    cx.lineWidth = 2; cx.beginPath();
    for(let i=0;i<arr.length;i++){
      const x = i/arr.length*W, y = mid + (arr[i]-128)/128*mid*.9;
      i ? cx.lineTo(x,y) : cx.moveTo(x,y);
    }
    cx.stroke();
  }
  function tick(){
    if(recording){ clock.textContent = fmt((performance.now()-recStart)/1000); drawLive(); }
    else if(playing){ drawLive(); }
    rafId = requestAnimationFrame(tick);
  }

  /* ---------- nahrávání ---------- */
  btnRec.addEventListener('click', async () => {
    if(recording){ mediaRecorder.stop(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      ensureCtx();
      chunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        recording = false;
        deck.classList.remove('recording');
        lamp.classList.remove('on');
        btnRec.classList.remove('armed');
        btnRec.textContent = '● Nahrát';
        setStatus('Zpracovávám pásku…');
        try{
          const arr = await new Blob(chunks).arrayBuffer();
          bufFwd = await ensureCtx().decodeAudioData(arr);
          bufRev = reverse(bufFwd);
          drawBuffer(bufRev);
          clock.textContent = fmt(bufFwd.duration);
          [btnPlay, btnStop, btnFwd, btnMp3, btnMp3Fwd].forEach(b => b.disabled = false);
          btnStop.disabled = true;
          setStatus('Nahráno <b>' + fmt(bufFwd.duration) + '</b>. Páska je připravená ke zpětnému chodu.');
        }catch(e){
          setStatus('Nahrávku se nepodařilo dekódovat: ' + e.message);
        }
      };
      // živý náhled
      const tap = ensureCtx().createMediaStreamSource(stream);
      analyser = ensureCtx().createAnalyser(); analyser.fftSize = 2048;
      tap.connect(analyser);
      mediaRecorder.start();
      recording = true; recStart = performance.now();
      deck.classList.add('recording');
      lamp.classList.add('on');
      btnRec.classList.add('armed');
      btnRec.textContent = '■ Zastavit nahrávání';
      setStatus('Nahrávám… mluv do mikrofonu.');
    }catch(e){
      setStatus('Mikrofon není dostupný: ' + e.message);
    }
  });

  /* ---------- obrácení bufferu ---------- */
  function reverse(buf){
    const out = ensureCtx().createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
    for(let ch=0; ch<buf.numberOfChannels; ch++){
      const s = buf.getChannelData(ch), d = out.getChannelData(ch);
      for(let i=0, n=buf.length; i<n; i++) d[i] = s[n-1-i];
    }
    return out;
  }

  /* ---------- přehrávání ---------- */
  function play(buf, dirLabel){
    stopPlayback();
    const ctx = ensureCtx();
    srcNode = ctx.createBufferSource();
    srcNode.buffer = buf;
    srcNode.loop = chkLoop.checked;
    srcNode.playbackRate.value = parseFloat(rngSpeed.value);
    analyser = ctx.createAnalyser(); analyser.fftSize = 2048;
    srcNode.connect(analyser).connect(ctx.destination);
    srcNode.onended = () => { if(!srcNode || !srcNode.loop){ stopPlayback(); } };
    srcNode.start();
    playing = true;
    deck.classList.add('playing');
    btnStop.disabled = false;
    setStatus('Přehrávám <b>' + dirLabel + '</b>' + (chkLoop.checked ? ' ve smyčce' : '') +
              ' · rychlost <b>' + parseFloat(rngSpeed.value).toFixed(2) + '×</b>');
  }
  function stopPlayback(){
    if(srcNode){ try{ srcNode.onended = null; srcNode.stop(); }catch(e){} srcNode = null; }
    playing = false;
    deck.classList.remove('playing');
    btnStop.disabled = true;
    if(bufRev) drawBuffer(bufRev);
  }

  btnPlay.addEventListener('click', () => play(bufRev, 'pozpátku ◄'));
  btnFwd .addEventListener('click', () => play(bufFwd, 'původní směr ►'));
  btnStop.addEventListener('click', () => { stopPlayback(); setStatus('Zastaveno.'); });
  chkLoop.addEventListener('change', () => { if(srcNode) srcNode.loop = chkLoop.checked; });
  rngSpeed.addEventListener('input', () => {
    outSpeed.textContent = parseFloat(rngSpeed.value).toFixed(2) + '×';
    if(srcNode) srcNode.playbackRate.value = parseFloat(rngSpeed.value);
  });

  /* ---------- export MP3 ---------- */
  function toMp3(buf){
    const ch = Math.min(2, buf.numberOfChannels);
    const rate = buf.sampleRate;
    const enc = new lamejs.Mp3Encoder(ch, rate, 128);
    const blockSize = 1152;
    const l = f2i(buf.getChannelData(0));
    const r = ch === 2 ? f2i(buf.getChannelData(1)) : null;
    const parts = [];
    for(let i=0; i<l.length; i+=blockSize){
      const lb = l.subarray(i, i+blockSize);
      const out = ch === 2 ? enc.encodeBuffer(lb, r.subarray(i, i+blockSize)) : enc.encodeBuffer(lb);
      if(out.length) parts.push(out);
    }
    const end = enc.flush();
    if(end.length) parts.push(end);
    return new Blob(parts, {type:'audio/mp3'});
  }
  function f2i(f32){
    const out = new Int16Array(f32.length);
    for(let i=0;i<f32.length;i++){
      const v = Math.max(-1, Math.min(1, f32[i]));
      out[i] = v < 0 ? v*32768 : v*32767;
    }
    return out;
  }
  function download(blob, name){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function exportMp3(buf, name, label){
    setStatus('Kóduji MP3…');
    setTimeout(() => {   // nech UI překreslit
      try{
        download(toMp3(buf), name);
        setStatus('Uloženo: <b>' + name + '</b> (' + label + ', 128 kb/s)');
      }catch(e){
        setStatus('Export MP3 selhal: ' + e.message);
      }
    }, 30);
  }
  btnMp3   .addEventListener('click', () => exportMp3(bufRev, 'nahravka-pozpatku.mp3', 'pozpátku'));
  btnMp3Fwd.addEventListener('click', () => exportMp3(bufFwd, 'nahravka-original.mp3', 'originál'));

  requestAnimationFrame(fitCanvas);
  tick();
})();
</script>
</body>
</html>
